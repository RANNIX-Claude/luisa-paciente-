<title>Luisa — Versión WhatsApp</title>
<style>
  :root {
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --paper: #F0F2F5;
    --ink: #0F1F3D;
    --ink-soft: #4B5C7A;
    --ink-faint: #8A9BB8;
    --line: #E2E8F0;
    --navy: #1B3F72;
    --navy-soft: #E8EEF7;
    --teal: #00C9A7;
    --teal-soft: #E0FAF5;
    --teal-deep: #009E84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #CBD5E1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 24px 12px; min-height: 100vh;
  }
  #phone {
    width: 400px; max-width: 100%; background: var(--bg); border-radius: 22px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(27,63,114,0.18);
    display: flex; flex-direction: column; min-height: 720px; position: relative;
  }
  .hidden { display: none !important; }

  /* Topbar */
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--navy); flex-shrink: 0;
  }
  .topbar .back { color: white; font-size: 20px; cursor: pointer; line-height: 1; background: none; border: none; padding: 0; }
  .topbar-title { flex: 1; min-width: 0; }
  .topbar-title p.t { margin: 0; font-size: 16px; font-weight: 700; color: white; }
  .topbar-title p.s { margin: 0; font-size: 11.5px; color: rgba(255,255,255,0.65); }
  .topbar-brand { font-size: 20px; font-weight: 800; color: white; letter-spacing: -0.5px; }
  .topbar-brand span { color: var(--teal); }

  .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .scroll { flex: 1; overflow-y: auto; }

  /* Transiciones de pantalla estilo nativo */
  #phone { perspective: 1000px; }
  .slide-in  { animation: slideIn  0.22s cubic-bezier(.25,.46,.45,.94) both; }
  .slide-out { animation: slideOut 0.18s cubic-bezier(.55,0,1,.45) both; }
  @keyframes slideIn  { from { transform: translateX(100%); opacity:.6; } to { transform: translateX(0); opacity:1; } }
  @keyframes slideOut { from { transform: translateX(0);    opacity:1; } to { transform: translateX(-30%); opacity:0; } }

  /* Barra de búsqueda */
  .searchbar {
    display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
    margin: 10px 14px 4px;
  }
  .searchbar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 13.5px; color: var(--ink); padding: 10px 0;
  }
  .searchbar input::placeholder { color: var(--ink-faint); }

  /* Fila de chat (médico) */
  .chat-row {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    cursor: pointer; text-align: left; transition: background 0.12s;
  }
  .chat-row:active { background: var(--navy-soft); }
  .chat-row .meta { flex: 1; min-width: 0; }
  .chat-row .meta p.n { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .chat-row .meta p.esp { margin: 1px 0 0; font-size: 11.5px; color: var(--teal-deep); font-weight: 500; }
  .chat-row .meta p.l { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .chat-row .date { font-size: 11px; color: var(--ink-faint); }
  .count-badge { background: var(--teal); color: white; font-size: 11px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  /* Avatar */
  .avatar {
    border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; font-size: 14px;
  }

  /* Tarjeta sticky datos críticos */
  .critico-bar {
    display: flex; gap: 0; background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .critico-item {
    flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-right: 1px solid var(--line); font-size: 12px;
  }
  .critico-item:last-child { border-right: none; }
  .critico-label { font-size: 10px; color: var(--ink-faint); display: block; line-height: 1; margin-bottom: 1px; }
  .critico-val { font-weight: 700; color: var(--ink); font-size: 12px; }

  /* Hilo de conversación */
  .thread { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg-system {
    align-self: center; font-size: 11px; color: var(--ink-faint);
    background: rgba(255,255,255,0.8); padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); margin: 4px 0;
  }
  /* Evento subido por el paciente (derecha) */
  .msg-yo {
    align-self: flex-end; max-width: 80%;
    background: var(--teal-soft); border: 1px solid rgba(0,201,167,0.2);
    border-radius: 12px 2px 12px 12px; padding: 10px 12px;
  }
  /* Nota del médico / resumen IA (izquierda) */
  .msg-luisa {
    align-self: flex-start; max-width: 82%;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 2px 12px 12px 12px; padding: 10px 12px;
  }
  .msg-tag { font-size: 10.5px; font-weight: 600; margin-bottom: 4px; }
  .msg-tag.doc { color: var(--teal-deep); }
  .msg-tag.nota { color: var(--navy); }
  .msg-tag.med { color: #7C3AED; }
  .msg-tag.cita { color: #B45309; }
  .msg-body { font-size: 13.5px; color: var(--ink); line-height: 1.5; }
  .msg-time { font-size: 10.5px; color: var(--ink-faint); margin-top: 5px; text-align: right; }
  .chip-ia { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal-deep); margin-top: 5px; }
  .med-card { background: var(--navy-soft); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .med-card p { margin: 0; font-size: 12.5px; }
  .med-card p.nm { font-weight: 700; color: var(--navy); }
  .med-card p.dt { color: var(--ink-soft); margin-top: 2px; }

  /* Composer */
  .composer {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--line); background: var(--card); flex-shrink: 0;
  }
  .composer-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--teal);
    border: none; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .composer input {
    flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px;
    font-size: 13.5px; background: var(--bg); color: var(--ink); outline: none;
  }

  /* FAB */
  .fab {
    position: absolute; right: 20px; bottom: 72px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--teal); border: none; color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,201,167,0.4); font-size: 22px; z-index: 10;
  }

  /* Modal bottom sheet */
  .sheet-overlay {
    position: absolute; inset: 0; background: rgba(15,31,61,0.5); z-index: 20;
    display: flex; align-items: flex-end;
  }
  .sheet {
    background: var(--card); width: 100%; border-radius: 20px 20px 0 0; padding: 20px 16px 28px;
    animation: slideUp 0.28s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 99px; margin: 0 auto 16px; }
  .sheet-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 14px; text-align: center; }
  .sheet-option {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 12px;
    background: var(--bg); border-radius: 12px; border: none; cursor: pointer;
    margin-bottom: 10px; text-align: left;
  }
  .sheet-option:active { background: var(--teal-soft); }
  .sheet-option .ico { font-size: 26px; }
  .sheet-option .lbl { font-size: 14px; font-weight: 600; color: var(--ink); }
  .sheet-option .sub { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .btn-cancel { width: 100%; padding: 12px; background: none; border: 1px solid var(--line); border-radius: 12px; font-size: 13.5px; color: var(--ink-soft); cursor: pointer; margin-top: 4px; }

  /* Botón agregar médico */
  .add-row {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    cursor: pointer; text-align: left; color: var(--ink-soft);
  }
  .add-circle { width: 48px; height: 48px; border-radius: 50%; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--ink-faint); flex-shrink: 0; }
</style>

// ─── TIMESTAMPS RELATIVOS ESTILO WHATSAPP ─────────────────
function tsRelativo(fechaStr) {
  if (!fechaStr) return '';
  const ahora = new Date();
  const fecha = new Date(fechaStr);
  const diffMs = ahora - fecha;
  const diffDias = Math.floor(diffMs / 86400000);
  if (diffDias === 0) return 'Hoy';
  if (diffDias === 1) return 'Ayer';
  if (diffDias < 7)  return fecha.toLocaleDateString('es-MX', {weekday:'short'});
  if (diffDias < 365) return fecha.toLocaleDateString('es-MX', {day:'numeric', month:'short'});
  return fecha.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
}

function tsHora(fechaStr) {
  if (!fechaStr) return '';
  return new Date(fechaStr).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}

// Convierte "10 feb 2025" o ISO a Date para comparar
function parseFecha(str) {
  if (!str) return new Date(0);
  if (str.includes('-') && str.length >= 8) return new Date(str);
  // Formato "10 feb 2025" → parsear manualmente
  const meses = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
  const p = str.trim().toLowerCase().split(' ');
  if (p.length === 3) return new Date(+p[2], meses[p[1]] ?? 0, +p[0]);
  return new Date(0);
}

function abrirSheet() {
  const el = document.getElementById('sheet-overlay');
  if (el) el.classList.remove('hidden');
}
function cerrarSheet(e) {
  if (!e || e.target === document.getElementById('sheet-overlay')) {
    const el = document.getElementById('sheet-overlay');
    if (el) el.classList.add('hidden');
  }
}

function agregarFoto() {
  cerrarSheet();
  const inp = document.getElementById('input-foto');

}

async function procesarFoto(event) {
  const file = event.target.files[0];
  if (!file || !medicoActual) return;
  event.target.value = '';

  const hora = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  const nueva = {
    id: 'v' + Date.now(), lado: 'yo', tag: 'doc', tagLabel: '📄 Documento subido',
    cuerpo: 'Luisa está leyendo tu documento...', hora
  };
  medicoActual.visitas.push(nueva);
  pantallaChat(medicoActual.id);

  try {
    let fotoUrl;
    if (usuarioActual) {
      fotoUrl = await subirFotoReal(file, usuarioActual.id);
    } else {
      fotoUrl = URL.createObjectURL(file);
    }

    const ia = await llamarIA(fotoUrl);
    nueva.cuerpo = ia?.titulo || 'Documento guardado.';
    nueva.ia = ia?.resumen || ia?.diagnostico || 'Analizado por Luisa.';

    if (usuarioActual) {
      await db.from('eventos_salud').insert({
        perfil_id: usuarioActual.id,
        medico_nombre: medicoActual.nombre,
        especialidad_medico: medicoActual.esp,
        titulo: nueva.cuerpo,
        resumen_ia: nueva.ia,
        foto_url: fotoUrl,
        tipo_documento: ia?.tipo_documento || 'documento'
      });
    }
  } catch(e) {
    nueva.cuerpo = 'Error al procesar. Intenta de nuevo.';
    nueva.ia = null;
  }

  pantallaChat(medicoActual.id);
}

async function _pushNota(texto) {
  const hora = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  const nueva = {
    id: 'v' + Date.now(), lado: 'yo', tag: 'nota', tagLabel: '📝 Nota',

  };
  medicoActual.visitas.push(nueva);
  pantallaChat(medicoActual.id);

  if (usuarioActual) {
    const { error } = await db.from('eventos_salud').insert({
      perfil_id: usuarioActual.id,
      medico_nombre: medicoActual.nombre,
      especialidad_medico: medicoActual.esp,
      titulo: 'Nota',
      descripcion: texto,
      tipo_documento: 'nota'
    });
    if (!error) {
      nueva.guardado = true;
      // Actualiza solo el timestamp en el DOM sin re-render completo
      pantallaChat(medicoActual.id);
    }
  } else {
    nueva.guardado = true;
  }
}

}

async function cerrarSesion() {
  await db.auth.signOut();
  usuarioActual = null;
  pantallaLogin();
}

// ─── CARGA DE DATOS REALES ────────────────────────────────
async function cargarMedicos(userId) {
  const { data, error } = await db
    .from('eventos_salud')
    .select('medico_nombre, especialidad_medico, created_at, titulo, resumen_ia')
    .eq('perfil_id', userId)
    .order('created_at', { ascending: false });

  if (error || !data || data.length === 0) return null;

  const byDoc = {};
  data.forEach(e => {
    const key = e.medico_nombre || 'Sin médico';
    if (!byDoc[key]) {
      byDoc[key] = {
        id: key,
        nombre: key,
        esp: e.especialidad_medico || 'Médico',
        ini: inicialesNombre(key),
        color: colorEsp(e.especialidad_medico),
        ultimo: e.titulo || e.resumen_ia || '—',
        fecha: new Date(e.created_at).toLocaleDateString('es-MX', {day:'numeric',month:'short',year:'numeric'}),
        visitas: []
      };
    }
  });

  for (const key of Object.keys(byDoc)) {
    const { data: eventos } = await db
      .from('eventos_salud')
      .select('*')
      .eq('perfil_id', userId)
      .eq('medico_nombre', key)
      .order('created_at', { ascending: true });

    if (eventos) {
      byDoc[key].visitas = eventos.map(e => ({
        id: e.id,
        lado: 'yo',
        tag: e.foto_url ? 'doc' : 'nota',
        tagLabel: e.foto_url ? '📄 ' + (e.titulo || 'Documento') : '📝 Nota',
        cuerpo: e.descripcion || e.titulo || '—',
        ia: e.resumen_ia || null,
        hora: new Date(e.created_at).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}),
        foto_url: e.foto_url || null
      }));
    }
  }

  return Object.values(byDoc);
}

async function cargarPerfil(userId) {
  const { data } = await db.from('perfiles_luisa').select('*').eq('id', userId).single();
  return data;
}

// ─── SUBIDA DE FOTO REAL ──────────────────────────────────
async function subirFotoReal(file, userId) {
  const ext = file.name.split('.').pop();
  const path = `${userId}/${Date.now()}.${ext}`;
  const { error: upErr } = await db.storage.from('luisa-fotos').upload(path, file);
  if (upErr) throw upErr;
  const { data: { publicUrl } } = db.storage.from('luisa-fotos').getPublicUrl(path);
  return publicUrl;
}

async function llamarIA(fotoUrl) {
  const res = await fetch('/.netlify/functions/procesar-documento', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ foto_url: fotoUrl })
  });
  if (!res.ok) return null;
  return res.json();
}

// ─── SEED DE DATOS DEMO A SUPABASE ───────────────────────
async function seedDemoSiEstaVacio(userId) {
  // Solo hace seed si el usuario no tiene eventos todavía
  const { count } = await db
    .from('eventos_salud')
    .select('id', { count: 'exact', head: true })
    .eq('perfil_id', userId);

  if (count > 0) return; // Ya tiene datos, no sobreescribir

  const filas = [];
  for (const med of D.medicos) {
    for (const v of med.visitas) {
      if (v.sistema) continue; // separadores no se guardan
      filas.push({
        perfil_id: userId,
        medico_nombre: med.nombre,
        especialidad_medico: med.esp,
        titulo: v.tagLabel?.replace(/^[^\s]+ /, '') || v.tag,
        descripcion: v.cuerpo,
        resumen_ia: v.ia || null,
        tipo_documento: v.tag === 'doc' ? 'documento' : 'nota',
        created_at: fechaDemoParaVisita(v.id)
      });
    }
  }

  if (filas.length > 0) {
    await db.from('eventos_salud').insert(filas);
    console.log(`Luisa: ${filas.length} eventos de demo cargados a Supabase`);
  }

  // Actualizar perfil con datos del paciente demo
  await db.from('perfiles_luisa').upsert({
    id: userId,
    nombre_completo: D.paciente.nombre,
    tipo_sangre: D.paciente.sangre,
    alergias_conocidas: D.paciente.alergias,
    updated_at: new Date().toISOString()
  }, { onConflict: 'id' });
}

// Fechas aproximadas para los eventos demo (por id)
function fechaDemoParaVisita(id) {
  const mapa = {
    v1:'2022-10-05', v2:'2023-06-14', v3:'2023-06-14',
    v4:'2025-01-03', v5:'2025-01-03', v6:'2025-07-14',
    v7:'2025-05-08', v8:'2025-05-08', v9:'2025-05-08',
    v10:'2025-05-08', v11:'2025-08-18', v12:'2022-01-15',
    v13:'2023-03-10', v14:'2025-02-12', v15:'2025-02-12',
    v16:'2023-09-08', v17:'2023-09-08', v18:'2024-04-10',
    v19:'2024-04-10', v20:'2023-11-20', v21:'2023-11-20',
    v22:'2025-03-05', v23:'2024-04-03', v24:'2024-04-03',
    v25:'2024-06-22',
  };
  return mapa[id] ? new Date(mapa[id]).toISOString() : new Date().toISOString();
}

// ─── INIT ─────────────────────────────────────────────────
async function init() {
  render(`<div style="display:flex;align-items:center;justify-content:center;height:300px;color:var(--ink-faint);font-size:14px">Cargando...</div>`);

  // Manejar magic link callback
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      window.history.replaceState(null, '', window.location.pathname);
      usuarioActual = session.user;
    }
  } else {
    const { data: { session } } = await db.auth.getSession();
    if (session) usuarioActual = session.user;
  }

  if (!usuarioActual) {
    pantallaLogin();
    return;
  }

  // Seed de datos demo si el usuario es nuevo (solo primera vez)
  await seedDemoSiEstaVacio(usuarioActual.id);

  // Cargar datos reales
  const [perfil, medicosDB] = await Promise.all([
    cargarPerfil(usuarioActual.id),
    cargarMedicos(usuarioActual.id)
  ]);

  if (perfil) {
    D.paciente.nombre = perfil.nombre_completo || usuarioActual.email;
    if (perfil.tipo_sangre) D.paciente.sangre = perfil.tipo_sangre;
    if (perfil.alergias_conocidas) D.paciente.alergias = perfil.alergias_conocidas;
  }

  if (medicosDB && medicosDB.length > 0) D.medicos = medicosDB;

  pantallaLista();
}

init();
</script>
