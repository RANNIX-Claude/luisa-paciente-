<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luisa — Mi Expediente Médico</title>
<style>
:root {
  --bg:#F5F7FA; --card:#FFFFFF; --ink:#0F1F3D; --ink-soft:#4B5C7A; --ink-faint:#8A9BB8;
  --line:#E2E8F0; --navy:#1B3F72; --navy-soft:#E8EEF7;
  --teal:#00C9A7; --teal-soft:#E0FAF5; --teal-deep:#009E84;
  --amber:#FEF3C7; --amber-ink:#B45309;
  --purple:#F3E8FF; --purple-ink:#7C3AED;
  --red-soft:#FEE2E2; --red-ink:#DC2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#CBD5E1;display:flex;justify-content:center;
  padding:24px 12px;min-height:100vh;
}
#phone{
  width:400px;max-width:100%;background:var(--bg);border-radius:22px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 12px 40px rgba(27,63,114,0.18);
  display:flex;flex-direction:column;min-height:720px;position:relative;
}
.hidden{display:none!important}

/* Animaciones */
.slide-in{animation:slideIn .22s cubic-bezier(.25,.46,.45,.94) both}
.slide-back{animation:slideBack .22s cubic-bezier(.25,.46,.45,.94) both}
@keyframes slideIn{from{transform:translateX(100%);opacity:.7}to{transform:translateX(0);opacity:1}}
@keyframes slideBack{from{transform:translateX(-30%);opacity:.7}to{transform:translateX(0);opacity:1}}

/* Topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--navy);flex-shrink:0}
.topbar .brand{font-size:20px;font-weight:800;color:white;letter-spacing:-.5px}
.topbar .brand span{color:var(--teal)}
.topbar .ttl{flex:1;min-width:0}
.topbar .ttl p{margin:0}
.topbar .ttl .t{font-size:15px;font-weight:700;color:white}
.topbar .ttl .s{font-size:11px;color:rgba(255,255,255,.6)}
.topbar .ico-btn{background:none;border:none;color:rgba(255,255,255,.75);font-size:20px;cursor:pointer;padding:4px;line-height:1}

.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.scroll{flex:1;overflow-y:auto}

/* Barra búsqueda */
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:10px 14px 4px}
.searchbar input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px;color:var(--ink);padding:10px 0}
.searchbar input::placeholder{color:var(--ink-faint)}

/* Barra datos críticos */
.critico-bar{display:flex;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.critico-item{flex:1;display:flex;align-items:center;gap:5px;padding:7px 10px;border-right:1px solid var(--line);font-size:12px}
.critico-item:last-child{border-right:none}
.cl{font-size:9.5px;color:var(--ink-faint);display:block;line-height:1;margin-bottom:1px}
.cv{font-weight:700;color:var(--ink);font-size:11.5px}

/* Chat row — expediente o médico */
.chat-row{
  width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:none;border:none;border-bottom:1px solid var(--line);
  cursor:pointer;text-align:left;transition:background .12s;
}
.chat-row:active{background:var(--navy-soft)}
.chat-row .meta{flex:1;min-width:0}
.chat-row .meta .n{font-size:14.5px;font-weight:600;color:var(--ink)}
.chat-row .meta .sub{font-size:11.5px;color:var(--teal-deep);font-weight:500;margin-top:1px}
.chat-row .meta .prev{font-size:12.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.chat-row .ts{font-size:11px;color:var(--ink-faint)}
.badge{background:var(--teal);color:white;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* Avatar */
.av{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:white}

/* ── FEED ──────────────────────────────────────────────── */
.thread{padding:10px 12px;display:flex;flex-direction:column;gap:10px}

/* Separador de fecha */
.msg-sys{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--ink-faint);margin:6px 0;
}
.msg-sys::before,.msg-sys::after{content:'';flex:1;height:1px;background:var(--line)}

/* Tarjeta feed — ancho completo */
.feed-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;
  box-shadow:0 1px 4px rgba(15,31,61,.06);
}
/* Cabecera de color según tipo */
.feed-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--line);
}
.feed-ico{font-size:20px;line-height:1;flex-shrink:0}
.feed-type{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.feed-body{padding:12px 14px;font-size:13.5px;color:var(--ink);line-height:1.55}
.feed-foot{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  padding:6px 14px 10px;font-size:10.5px;color:var(--ink-faint);
}
.tick{color:var(--teal);font-size:11px}

/* Colores de cabecera por tipo */
.h-receta    {background:#F3E8FF} .h-receta    .feed-type{color:var(--purple-ink)}
.h-resultado {background:#ECFDF5} .h-resultado .feed-type{color:var(--teal-deep)}
.h-estudio   {background:#EFF6FF} .h-estudio   .feed-type{color:#0369A1}
.h-diagnostico{background:#FEE2E2}.h-diagnostico .feed-type{color:var(--red-ink)}
.h-cita      {background:var(--amber)} .h-cita .feed-type{color:var(--amber-ink)}
.h-nota      {background:var(--navy-soft)} .h-nota .feed-type{color:var(--navy)}
.h-doc       {background:var(--teal-soft)} .h-doc .feed-type{color:var(--teal-deep)}

/* Sub-tarjetas dentro del feed */
.med-card{background:var(--purple);border-radius:8px;padding:9px 11px;margin-top:8px}
.med-card .mn{font-weight:700;color:var(--purple-ink);font-size:13px}
.med-card .md{color:var(--ink-soft);font-size:12px;margin-top:2px}
.lab-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.lab-row:last-child{border-bottom:none}
.lab-row .lval{flex:1;color:var(--ink)}
.lab-row .lref{font-size:11px;color:var(--ink-faint)}
.ok{color:var(--teal-deep);font-weight:700}
.warn{color:var(--amber-ink);font-weight:700}
.bad{color:var(--red-ink);font-weight:700}
.est-row{font-size:12.5px;color:#0369A1;padding:3px 0}
.cita-big{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.cita-big .cfecha{font-size:18px;font-weight:800;color:var(--amber-ink);line-height:1.2}
.cita-big .cdet{font-size:12px;color:var(--ink-soft);margin-top:2px}
.ia-block{margin-top:10px;padding:10px 12px;background:rgba(0,201,167,.07);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;font-size:12.5px;color:#007A66;line-height:1.55}
.chip-ia{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep);margin-top:8px}
.alerta{margin-top:8px;font-size:12px;color:var(--amber-ink);background:var(--amber);border-radius:8px;padding:8px 10px;display:flex;gap:6px;align-items:flex-start}

/* Composer */
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
.cam-btn{width:40px;height:40px;border-radius:50%;background:var(--teal);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}
.composer-input{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 16px;font-size:14px;background:var(--bg);color:var(--ink);outline:none}
.consulta-btn{background:none;border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;white-space:nowrap}

/* Sheet */
.sheet-overlay{position:absolute;inset:0;background:rgba(15,31,61,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 16px 28px;animation:slideUp .28s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.sheet-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;text-align:center}
.sheet-opt{width:100%;display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:12px;border:none;cursor:pointer;margin-bottom:8px;text-align:left}
.sheet-opt:active{background:var(--teal-soft)}
.sheet-opt .ico{font-size:24px;width:36px;text-align:center;flex-shrink:0}
.sheet-opt .lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
.sheet-opt .sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.btn-cancel{width:100%;padding:12px;background:none;border:1px solid var(--line);border-radius:12px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;margin-top:4px}

/* Add row */
.add-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.add-circle{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-faint);flex-shrink:0}

/* Expediente selector badge */
.exp-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px;color:white;cursor:pointer;border:none}

/* Form */
.form-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:10px}
.form-select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:10px}
.btn-primary{width:100%;background:var(--navy);color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.btn-primary:active{background:#142f55}
.form-label{font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:block;font-weight:600}
.section-pad{padding:20px 18px;display:flex;flex-direction:column;gap:0}
</style>
</head>

const phone = document.getElementById('phone');

function render(html, dir = 'none') {
  const c = document.createElement('div');
  c.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden';
  c.innerHTML = html;
  if (dir === 'adelante') c.classList.add('slide-in');
  if (dir === 'atras')    c.classList.add('slide-back');
  phone.innerHTML = '';
  phone.appendChild(c);
}

function tsRel(fechaStr) {
  if (!fechaStr) return '';
  const ahora = new Date(), f = new Date(fechaStr);
  const d = Math.floor((ahora - f) / 86400000);
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Ayer';
  if (d < 7)   return f.toLocaleDateString('es-MX',{weekday:'short'});
  if (d < 365) return f.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  return f.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
}

// ─── RENDER DE MENSAJE ────────────────────────────────────
// Metadatos por tipo de evento
const TIPO_META = {
  receta:     {ico:'💊', label:'Receta',           hdr:'h-receta'},
  resultado:  {ico:'📊', label:'Resultado',         hdr:'h-resultado'},
  estudio_orden:{ico:'🔬',label:'Estudios ordenados',hdr:'h-estudio'},
  diagnostico:{ico:'🩺', label:'Diagnóstico',       hdr:'h-diagnostico'},
  cita:       {ico:'📅', label:'Próxima cita',      hdr:'h-cita'},
  nota:       {ico:'📝', label:'Nota',              hdr:'h-nota'},
  doc:        {ico:'📄', label:'Documento',         hdr:'h-doc'},
};

function renderMensaje(v) {
  if (v.sistema) return `<div class="msg-sys">${v.sistema}</div>`;

  const tick  = v.guardado ? '<span class="tick">✓✓</span>' : '';
  const meta  = TIPO_META[v.tipo||'nota'] || TIPO_META.nota;

  // Bloque IA
  let iaHTML = '';
  if (v.ia) {
    const lineas = v.ia.split('\n').map(l=>l.trim()).filter(Boolean);
    iaHTML = `<div class="ia-block">✦ ${lineas.map(l=>`<div>${l}</div>`).join('')}</div>`;
  }

  // Medicamentos
  let medsHTML = '';
  if (v.meds && v.meds.length) {
    medsHTML = v.meds.map(m=>`
      <div class="med-card">
        <div class="mn">💊 ${m.mn}</div>
        <div class="md">${m.md}</div>
      </div>`).join('');
  }

  // Laboratorios
  let labsHTML = '';
  if (v.labs && v.labs.length) {
    labsHTML = `<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px">`
      + v.labs.map(l=>{
          const cls = l.estado==='ok'?'ok':l.estado==='warn'?'warn':'bad';
          const ico = l.estado==='ok'?'✓':l.estado==='warn'?'⚠':'✗';
          return `<div class="lab-row"><span class="${cls}">${ico}</span><span class="lval">${l.val}</span><span class="lref">${l.ref}</span></div>`;
        }).join('')
      + `</div>`;
  }

  // Estudios ordenados
  let estudiosHTML = '';
  if (v.estudios && v.estudios.length) {
    estudiosHTML = `<div style="background:#EFF6FF;border-radius:8px;padding:10px 12px;margin-top:8px">`
      + v.estudios.map(e=>`<div class="est-row">🔬 ${e}</div>`).join('')
      + `</div>`;
  }

  // Próxima cita
  let citaHTML = '';
  if (v.cita) {
    citaHTML = `<div class="cita-big">
      <div class="cfecha">${v.cita.fecha}</div>
      <div><div style="font-size:12.5px;font-weight:600;color:var(--ink)">${v.cita.motivo||''}</div>
      <div class="cdet">${v.cita.lugar||''}</div></div>
    </div>`;
  }

  // Alerta
  let alertaHTML = '';
  if (v.alerta) alertaHTML = `<div class="alerta"><span>⚠️</span><span>${v.alerta.replace('⚠️','').trim()}</span></div>`;

  // Chip IA
  const chipIA = (v.ia||v.labs) ? `<div><span class="chip-ia">✦ Organizado por Luisa</span></div>` : '';

  return `
    <div class="feed-card">
      <div class="feed-header ${meta.hdr}">
        <span class="feed-ico">${meta.ico}</span>
        <span class="feed-type">${meta.label}</span>
      </div>
      <div class="feed-body">
        ${v.cuerpo ? `<div style="margin-bottom:${(v.meds||v.labs||v.estudios||v.cita||v.ia)?'8px':'0'}">${v.cuerpo}</div>` : ''}
        ${medsHTML}${labsHTML}${estudiosHTML}${citaHTML}${iaHTML}${alertaHTML}${chipIA}
      </div>
      <div class="feed-foot">${v.hora||''}${tick}</div>
    </div>`;
}

function nuevaConsulta() {
  const hoy = new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});

function abrirSheet() { document.getElementById('sheet-overlay')?.classList.remove('hidden'); }
function cerrarSheet(e) {
  if (!e||e.target===document.getElementById('sheet-overlay'))
    document.getElementById('sheet-overlay')?.classList.add('hidden');
}

function agregarFoto() { cerrarSheet(); document.getElementById('input-foto')?.click(); }
function agregarNota() {
  cerrarSheet();
  const t = prompt('¿Qué quieres anotar?');
  if (t && t.trim()) _pushNota(t.trim());
}
function enviarNota() {
  const inp = document.getElementById('inp-nota');
  if (!inp||!inp.value.trim()) return;
  _pushNota(inp.value.trim()); inp.value='';
}

async function _pushNota(texto) {
  const hora = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const nueva = {id:'v'+Date.now(),lado:'yo',tipo:'nota',tagLabel:'📝 Nota',cuerpo:texto,hora,guardado:false};
  medicoActual.visitas.push(nueva);
  pantallaChat(medicoActual.id);
  if (usuarioActual) {
    const {error} = await db.from('eventos_salud').insert({
      perfil_id:usuarioActual.id,
      medico_nombre:medicoActual.nombre, especialidad_medico:medicoActual.esp,
      titulo:'Nota', descripcion:texto, tipo_documento:'nota'
    });
    if (!error) { nueva.guardado=true; pantallaChat(medicoActual.id); }
  } else { nueva.guardado=true; }
}

async function procesarFoto(event) {
  const file = event.target.files[0];
  if (!file||!medicoActual) return;
  event.target.value='';
  const hora = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const nueva = {id:'v'+Date.now(),lado:'yo',tipo:'doc',tagLabel:'📄 Documento',cuerpo:'Luisa está leyendo tu documento...',hora,guardado:false};
  medicoActual.visitas.push(nueva);
  pantallaChat(medicoActual.id);
  try {
    let url;
    if (usuarioActual) {
      const ext = file.name.split('.').pop();
      const path = `${usuarioActual.id}/${Date.now()}.${ext}`;
      await db.storage.from('luisa-fotos').upload(path, file);
      const {data:{publicUrl}} = db.storage.from('luisa-fotos').getPublicUrl(path);
      url = publicUrl;
    } else { url = URL.createObjectURL(file); }
    const res = await fetch('/.netlify/functions/procesar-documento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({foto_url:url})});
    const ia = res.ok ? await res.json() : null;
    nueva.cuerpo = ia?.titulo||'Documento guardado.';
    nueva.ia     = ia?.resumen||ia?.diagnostico||null;
    nueva.tagLabel = ia?.tipo_documento==='receta'?'💊 Receta':ia?.tipo_documento==='laboratorio'?'📊 Resultado':'📄 Documento';
    if (usuarioActual) {
      await db.from('eventos_salud').insert({
        perfil_id:usuarioActual.id, medico_nombre:medicoActual.nombre, especialidad_medico:medicoActual.esp,
        titulo:nueva.cuerpo, resumen_ia:nueva.ia, foto_url:url, tipo_documento:ia?.tipo_documento||'documento'
      });
      nueva.guardado=true;
    } else { nueva.guardado=true; }
  } catch(e) { nueva.cuerpo='Error al procesar. Intenta de nuevo.'; }
  pantallaChat(medicoActual.id);
}

function pantallaEsperando(email) {
  render(`

    </div>

      </p>
      <button onclick="pantallaLogin()" style="margin-top:12px;background:none;border:1px solid var(--line);border-radius:12px;padding:11px 24px;font-size:13.5px;color:var(--ink-soft);cursor:pointer">

async function enviarMagicLink() {
  const email = document.getElementById('inp-email')?.value?.trim();
  if (!email) return;
  const btn = document.querySelector('[onclick="enviarMagicLink()"]');
  if (btn) { btn.disabled=true; btn.textContent='Enviando...'; }
  const {error} = await db.auth.signInWithOtp({email, options:{emailRedirectTo:window.location.href}});
  if (error) { alert('Error: '+error.message); if(btn){btn.disabled=false;btn.textContent='Entrar con enlace mágico';} }
  else pantallaEsperando(email);
}

function usarDemo() { usuarioActual=null; expedienteActual=APP.expedientes[0]; pantallaExpedientes(); }

async function cerrarSesion() { await db.auth.signOut(); usuarioActual=null; pantallaLogin(); }

// ─── INIT ─────────────────────────────────────────────────
async function init() {
  render(`<div style="display:flex;align-items:center;justify-content:center;height:300px;color:var(--ink-faint);font-size:14px">Cargando...</div>`);
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const {data:{session}} = await db.auth.getSession();
    if (session) { window.history.replaceState(null,'',window.location.pathname); usuarioActual=session.user; }
  } else {
    const {data:{session}} = await db.auth.getSession();
    if (session) usuarioActual=session.user;
  }
  if (!usuarioActual) { pantallaLogin(); return; }
  // Usuario autenticado: mostrar expediente principal (el suyo)
  expedienteActual = APP.expedientes[0];
  pantallaExpedientes();
}

init();
</script>
